version: '3'

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the headless engine checks
    cmds:
      - mkdir -p build
      - ob build GameLoopSmoke.Mod -o build/game-loop-smoke
      - ob build SceneSmoke.Mod -o build/scene-smoke
      - ob build SectorSmoke.Mod -o build/sector-smoke
      - ob build SpriteSmoke.Mod -o build/sprite-smoke
      - ob build AnimationSmoke.Mod -o build/animation-smoke

  check:
    desc: Check simulation, geometry, pixels, clock and byte decoding
    cmds:
      - task: build
      - timeout 10 ./build/game-loop-smoke
      - timeout 10 ./build/scene-smoke
      - timeout 10 ./build/sector-smoke
      - timeout 10 ./build/sprite-smoke
      - timeout 10 ./build/animation-smoke
